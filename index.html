<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reproductor MP3 - Android</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
        }

        /* Botón de seleccionar carpeta */
        .folder-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            touch-action: manipulation;
        }

        .folder-btn:active {
            transform: scale(0.97);
        }

        /* Lista de canciones */
        .playlist {
            max-height: 300px;
            overflow-y: auto;
            margin: 16px 0;
            border-radius: 20px;
            background: #f5f5f5;
        }

        .song-item {
            padding: 14px 16px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
            touch-action: manipulation;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-item:active {
            background: #e0e0e0;
        }

        .song-item.active {
            background: linear-gradient(90deg, #667eea20 0%, #764ba220 100%);
            border-left: 4px solid #764ba2;
        }

        .song-name {
            font-size: 0.9rem;
            color: #333;
            word-break: break-word;
            flex: 1;
        }

        .song-duration {
            font-size: 0.75rem;
            color: #999;
            margin-left: 8px;
        }

        /* Controles grandes (táctiles) */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 24px 0;
        }

        .ctrl-btn {
            background: #f0f0f0;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 60px;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.1s ease;
            touch-action: manipulation;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: #e0e0e0;
        }

        .play-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 70px;
            height: 70px;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        /* Barra de progreso */
        .progress-container {
            margin: 16px 0;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Info canción actual */
        .current-song {
            text-align: center;
            margin: 16px 0 8px;
            font-weight: 500;
            color: #333;
            font-size: 1rem;
            padding: 8px;
            background: #f9f9f9;
            border-radius: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Scroll personalizado */
        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .empty-msg {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="player">
        <h1>🎵 Mi MP3</h1>
        <div class="sub">Reproductor para Android</div>

        <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
        <button class="folder-btn" id="selectFolderBtn">📁 SELECCIONAR CARPETA DE MÚSICA</button>

        <div class="current-song" id="currentSong">🎧 Ninguna canción seleccionada</div>

        <div class="progress-container">
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn">⏮</button>
            <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
            <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>

        <div class="playlist" id="playlist">
            <div class="empty-msg">📂 Selecciona una carpeta con MP3</div>
        </div>
        <footer>Toque en una canción para reproducir</footer>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Elementos del DOM
        const folderInput = document.getElementById('folderInput');
        const selectFolderBtn = document.getElementById('selectFolderBtn');
        const playlistDiv = document.getElementById('playlist');
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentSongSpan = document.getElementById('currentSong');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // Variables globales
        let songList = [];      // Array de objetos { name, url, file }
        let currentIndex = -1;
        let isPlaying = false;

        // Abrir selector de carpeta al hacer clic
        selectFolderBtn.addEventListener('click', () => {
            folderInput.click();
        });

        // Cuando se selecciona una carpeta
        folderInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files);
            const mp3Files = files.filter(file => file.name.toLowerCase().endsWith('.mp3'));

            if (mp3Files.length === 0) {
                playlistDiv.innerHTML = '<div class="empty-msg">❌ No se encontraron archivos MP3 en esta carpeta</div>';
                songList = [];
                currentIndex = -1;
                resetPlayer();
                return;
            }

            // Crear lista de canciones
            songList = mp3Files.map((file, idx) => ({
                id: idx,
                name: file.name.replace('.mp3', '').replace(/_/g, ' '),
                url: URL.createObjectURL(file),
                file: file
            }));

            renderPlaylist();
            // Si hay canciones, seleccionar la primera automáticamente
            if (songList.length > 0) {
                currentIndex = 0;
                loadSong(currentIndex);
            }
        });

        // Renderizar lista de canciones
        function renderPlaylist() {
            if (songList.length === 0) {
                playlistDiv.innerHTML = '<div class="empty-msg">🎵 Selecciona una carpeta con MP3</div>';
                return;
            }

            playlistDiv.innerHTML = '';
            songList.forEach((song, idx) => {
                const songDiv = document.createElement('div');
                songDiv.className = 'song-item';
                if (idx === currentIndex) songDiv.classList.add('active');
                songDiv.innerHTML = `
                    <span class="song-name">${escapeHtml(song.name)}</span>
                    <span class="song-duration"></span>
                `;
                songDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentIndex = idx;
                    loadSong(currentIndex);
                    playAudio();
                });
                playlistDiv.appendChild(songDiv);
            });
        }

        // Cargar canción
        function loadSong(index) {
            if (!songList[index]) return;

            // Limpiar URL anterior para evitar memory leaks
            if (audio.src) {
                URL.revokeObjectURL(audio.src);
            }

            audio.src = songList[index].url;
            audio.load();
            currentSongSpan.textContent = `🎵 ${songList[index].name}`;
            updateActiveClass(index);
            
            // Resetear tiempo
            currentTimeSpan.textContent = '0:00';
            totalTimeSpan.textContent = '0:00';
            progressFill.style.width = '0%';
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        }

        // Reproducir audio
        function playAudio() {
            if (!songList.length || currentIndex === -1) return;
            audio.play();
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        }

        function togglePlayPause() {
            if (!songList.length || currentIndex === -1) return;
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function nextSong() {
            if (songList.length === 0) return;
            currentIndex = (currentIndex + 1) % songList.length;
            loadSong(currentIndex);
            playAudio();
        }

        function prevSong() {
            if (songList.length === 0) return;
            currentIndex = (currentIndex - 1 + songList.length) % songList.length;
            loadSong(currentIndex);
            playAudio();
        }

        // Actualizar clase activa en la playlist
        function updateActiveClass(index) {
            const items = document.querySelectorAll('.song-item');
            items.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Resetear reproductor cuando no hay canciones
        function resetPlayer() {
            audio.pause();
            audio.src = '';
            isPlaying = false;
            playPauseBtn.textContent = '▶';
            currentSongSpan.textContent = '🎧 Ninguna canción seleccionada';
            currentTimeSpan.textContent = '0:00';
            totalTimeSpan.textContent = '0:00';
            progressFill.style.width = '0%';
        }

        // Eventos del audio
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                totalTimeSpan.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeSpan.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        // Barra de progreso táctil
        progressBar.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // Eventos táctiles para móvil (touch)
        progressBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const percent = Math.min(1, Math.max(0, touchX / rect.width));
            audio.currentTime = percent * audio.duration;
        });

        // Botones
        playPauseBtn.addEventListener('click', togglePlayPause);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);

        // Soporte para notificaciones en Android (MediaSession)
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => playAudio());
            navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
            navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
            navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
        }

        // Formatear tiempo mm:ss
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Evitar XSS en nombres de canciones
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        // Limpiar URLs al salir (buena práctica)
        window.addEventListener('beforeunload', () => {
            songList.forEach(song => {
                if (song.url) URL.revokeObjectURL(song.url);
            });
        });
    </script>
</body>
</html>
