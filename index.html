<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reproductor MP3 Lite - Android</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 20px 16px 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.5rem;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 12px;
            font-size: 0.75rem;
            color: #856404;
            margin: 12px 0;
            border-radius: 12px;
        }

        .folder-btn {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin: 12px 0;
            touch-action: manipulation;
        }

        .folder-btn:active {
            transform: scale(0.97);
            background: #2a2a4e;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: #e0e0e0;
            border: none;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
        }

        .mode-btn.active {
            background: #1a1a2e;
            color: white;
        }

        .file-input {
            display: none;
        }

        .playlist {
            max-height: 280px;
            overflow-y: auto;
            margin: 12px 0;
            border-radius: 16px;
            background: #f5f5f5;
        }

        .song-item {
            padding: 12px 14px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-item:active {
            background: #e8e8e8;
        }

        .song-item.active {
            background: #e3f2fd;
            border-left: 3px solid #1a1a2e;
        }

        .song-name {
            font-size: 0.85rem;
            color: #333;
            word-break: break-word;
            flex: 1;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0 16px;
        }

        .ctrl-btn {
            background: #f0f0f0;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 55px;
            font-size: 1.5rem;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:active {
            transform: scale(0.94);
        }

        .play-btn {
            background: #1a1a2e;
            color: white;
            width: 65px;
            height: 65px;
            font-size: 1.8rem;
        }

        .progress-container {
            margin: 12px 0;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #777;
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #1a1a2e;
            border-radius: 5px;
        }

        .current-song {
            text-align: center;
            font-size: 0.85rem;
            color: #1a1a2e;
            padding: 8px;
            background: #f0f0f0;
            border-radius: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .counter {
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }

        .empty-msg {
            text-align: center;
            padding: 30px 20px;
            color: #999;
            font-size: 0.85rem;
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            color: #aaa;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="player">
        <h1>🎵 MP3 Lite</h1>
        
        <div class="warning">
            ⚠️ Si el navegador se cierra, prueba con menos canciones o usa modo "Selección múltiple"
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" id="modeFolderBtn">📁 Carpeta</button>
            <button class="mode-btn" id="modeFilesBtn">🎵 Varios archivos</button>
        </div>

        <!-- Input oculto para carpeta -->
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
        
        <!-- Input oculto para archivos múltiples -->
        <input type="file" id="filesInput" accept=".mp3" multiple style="display: none;">
        
        <button class="folder-btn" id="selectBtn">📂 SELECCIONAR MÚSICA</button>

        <div class="current-song" id="currentSong">🎧 Sin canción</div>

        <div class="progress-container">
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn">⏮</button>
            <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
            <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>

        <div class="playlist" id="playlist">
            <div class="empty-msg">📂 Selecciona tu música</div>
        </div>
        <div class="counter" id="counter"></div>
        <footer>🎯 Modo archivos = más estable en Android</footer>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Elementos
        const folderInput = document.getElementById('folderInput');
        const filesInput = document.getElementById('filesInput');
        const selectBtn = document.getElementById('selectBtn');
        const modeFolderBtn = document.getElementById('modeFolderBtn');
        const modeFilesBtn = document.getElementById('modeFilesBtn');
        const playlistDiv = document.getElementById('playlist');
        const counterDiv = document.getElementById('counter');
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const currentSongSpan = document.getElementById('currentSong');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let songList = [];
        let currentIndex = -1;
        let isPlaying = false;
        let currentMode = 'folder'; // 'folder' o 'files'

        // Cambiar modo
        modeFolderBtn.addEventListener('click', () => {
            currentMode = 'folder';
            modeFolderBtn.classList.add('active');
            modeFilesBtn.classList.remove('active');
        });

        modeFilesBtn.addEventListener('click', () => {
            currentMode = 'files';
            modeFilesBtn.classList.add('active');
            modeFolderBtn.classList.remove('active');
        });

        // Botón principal
        selectBtn.addEventListener('click', () => {
            if (currentMode === 'folder') {
                folderInput.click();
            } else {
                filesInput.click();
            }
        });

        // Modo CARPETA (con límite para evitar cierre)
        folderInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files);
            const mp3Files = files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
            
            // Limitar a 100 canciones máximo para evitar crash
            const MAX_SONGS = 100;
            let limitedFiles = mp3Files;
            let warningMsg = '';
            
            if (mp3Files.length > MAX_SONGS) {
                limitedFiles = mp3Files.slice(0, MAX_SONGS);
                warningMsg = `⚠️ Solo se cargaron ${MAX_SONGS} de ${mp3Files.length} canciones (límite por estabilidad)`;
            }
            
            if (limitedFiles.length === 0) {
                showEmpty('❌ No hay archivos MP3');
                return;
            }
            
            processFiles(limitedFiles, warningMsg);
        });

        // Modo ARCHIVOS MÚLTIPLES (más estable)
        filesInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files);
            const mp3Files = files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
            
            if (mp3Files.length === 0) {
                showEmpty('❌ Selecciona archivos MP3');
                return;
            }
            
            processFiles(mp3Files, '');
        });

        function processFiles(files, warningMsg) {
            // Limpiar URLs anteriores
            songList.forEach(song => {
                if (song.url) URL.revokeObjectURL(song.url);
            });
            
            // Crear nueva lista
            songList = files.map((file, idx) => ({
                id: idx,
                name: file.name.replace(/\.mp3$/i, '').replace(/[_\-]+/g, ' '),
                url: URL.createObjectURL(file),
                file: file
            }));
            
            renderPlaylist();
            counterDiv.textContent = `${songList.length} canciones cargadas`;
            
            if (warningMsg) {
                counterDiv.style.color = '#856404';
                counterDiv.textContent = warningMsg;
                setTimeout(() => {
                    counterDiv.style.color = '#666';
                    counterDiv.textContent = `${songList.length} canciones cargadas`;
                }, 3000);
            }
            
            if (songList.length > 0) {
                currentIndex = 0;
                loadSong(0);
            }
        }

        function renderPlaylist() {
            if (songList.length === 0) {
                playlistDiv.innerHTML = '<div class="empty-msg">🎵 Selecciona música para empezar</div>';
                return;
            }
            
            playlistDiv.innerHTML = '';
            // Mostrar solo primeros 100 en la lista visible (por rendimiento)
            const displayLimit = Math.min(songList.length, 200);
            
            for (let i = 0; i < displayLimit; i++) {
                const song = songList[i];
                const songDiv = document.createElement('div');
                songDiv.className = 'song-item';
                if (i === currentIndex) songDiv.classList.add('active');
                songDiv.innerHTML = `<span class="song-name">${escapeHtml(truncate(song.name, 35))}</span>`;
                songDiv.addEventListener('click', ((idx) => {
                    return () => {
                        currentIndex = idx;
                        loadSong(currentIndex);
                        playAudio();
                    };
                })(i));
                playlistDiv.appendChild(songDiv);
            }
            
            if (songList.length > 200) {
                const moreDiv = document.createElement('div');
                moreDiv.className = 'empty-msg';
                moreDiv.textContent = `+ ${songList.length - 200} canciones más (solo visibles las primeras)`;
                moreDiv.style.fontSize = '0.7rem';
                playlistDiv.appendChild(moreDiv);
            }
        }
        
        function truncate(str, len) {
            return str.length > len ? str.substring(0, len) + '…' : str;
        }

        function loadSong(index) {
            if (!songList[index]) return;
            
            if (audio.src) {
                URL.revokeObjectURL(audio.src);
            }
            
            audio.src = songList[index].url;
            audio.load();
            currentSongSpan.textContent = `🎵 ${truncate(songList[index].name, 40)}`;
            updateActiveClass(index);
            currentTimeSpan.textContent = '0:00';
            totalTimeSpan.textContent = '0:00';
            progressFill.style.width = '0%';
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        }

        function updateActiveClass(index) {
            const items = document.querySelectorAll('.song-item');
            items.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function playAudio() {
            if (!songList.length || currentIndex === -1) return;
            audio.play().catch(e => console.log('Error:', e));
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        }

        function togglePlayPause() {
            if (!songList.length || currentIndex === -1) return;
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function nextSong() {
            if (songList.length === 0) return;
            currentIndex = (currentIndex + 1) % songList.length;
            loadSong(currentIndex);
            playAudio();
        }

        function prevSong() {
            if (songList.length === 0) return;
            currentIndex = (currentIndex - 1 + songList.length) % songList.length;
            loadSong(currentIndex);
            playAudio();
        }

        function showEmpty(msg) {
            playlistDiv.innerHTML = `<div class="empty-msg">${msg}</div>`;
            counterDiv.textContent = '0 canciones';
            songList = [];
            currentIndex = -1;
            resetPlayer();
        }

        function resetPlayer() {
            audio.pause();
            if (audio.src) URL.revokeObjectURL(audio.src);
            audio.src = '';
            isPlaying = false;
            playPauseBtn.textContent = '▶';
            currentSongSpan.textContent = '🎧 Sin canción';
            currentTimeSpan.textContent = '0:00';
            totalTimeSpan.textContent = '0:00';
            progressFill.style.width = '0%';
        }

        // Eventos del audio
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeSpan.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            nextSong();
        });

        // Barra de progreso
        progressBar.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        progressBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const percent = Math.min(1, Math.max(0, touchX / rect.width));
            audio.currentTime = percent * audio.duration;
        });

        // Botones
        playPauseBtn.addEventListener('click', togglePlayPause);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.addEventListener('beforeunload', () => {
            songList.forEach(song => {
                if (song.url) URL.revokeObjectURL(song.url);
            });
        });
    </script>
</body>
</html>
